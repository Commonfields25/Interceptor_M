name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/05-documentation.yml'
  pull_request:
  schedule:
     cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install markdownlint-cli2
      - run: |
          EXCLUDE="--exclude=.git --exclude=node_modules --exclude=_site --exclude=.venv --exclude=vendor"
          MD_FILES=$(find . $EXCLUDE -name "*.md" -type f | sort | head -30)
          if [ -z "$MD_FILES" ]; then
            echo "No markdown files to lint"
            exit 0
          fi
          FAILED=0
          for f in $MD_FILES; do
            echo "Linting: $f"
            markdownlint "$f" || FAILED=$((FAILED + 1))
          done
          echo "$FAILED file(s) with issues"
          exit 0

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Mermaid Diagrams
        run: |
          for f in $(find . -name "*.mmd" -o -name "*.mermaid"); do
            echo "Diagram: $f"
          done

  jekyll-pages:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v4
      - uses: actions/setup-ruby@v3
        with:
          ruby-version: '3.1'
      - name: Setup Pages
        run: |
          if [ -f Gemfile ]; then
            bundle install
          fi
      - name: Build Pages
        run: |
          if [ -f Gemfile ]; then
            bundle exec jekyll build --destination ./_site
          else
            # Fallback: copy markdown files if no Jekyll setup
            mkdir -p _site
            cp -r docs/ _site/ 2>/dev/null || true
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
