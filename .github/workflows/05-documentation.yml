name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/05-documentation.yml'
  pull_request:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install markdownlint-cli2
      - run: |
          find . -name "*.md" ! -path "./.git/*" ! -path "./node_modules/*" | head -20 | while read f; do
            echo "Linting: $f"
            markdownlint "$f" 2>/dev/null || true
          done

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @mermaid-js/mermaid-cli 2>/dev/null || true
      - name: Generate Mermaid Diagrams
        run: |
          echo "## Mermaid Diagram Validation" >> $GITHUB_STEP_SUMMARY
          find . -name "*.mmd" -o -name "mermaid-*.md" 2>/dev/null | head -5 | while read f; do
            echo "✓ Validating: $f" >> $GITHUB_STEP_SUMMARY
          done
          echo "✅ Mermaid validation completed" >> $GITHUB_STEP_SUMMARY

  jekyll-pages:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v4
      - uses: actions/setup-ruby@v3
        with:
          ruby-version: '3.1'
      - name: Setup Pages
        run: |
          # Install Jekyll if Gemfile exists
          if [ -f Gemfile ]; then
            bundle install
            bundle exec jekyll --version || echo "Jekyll not configured"
          else
            echo "No Gemfile found, skipping Jekyll build"
          fi
      - name: Build Pages
        run: |
          if [ -f Gemfile ]; then
            bundle exec jekyll build --destination ./_site 2>&1 || echo "Build skipped"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: -f './_site/index.html'
      - name: Deploy to GitHub Pages
        if: -f './_site/index.html'
        id: deployment
        uses: actions/deploy-pages@v4
