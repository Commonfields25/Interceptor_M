name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
     cron: '0 2 * * *'  # Daily at 2 AM

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pylint pylint-json-summary
      - run: find . -name "*.py" ! -path "./.venv/*" -exec pylint --output-format=json {} + > pylint_results.json || true
      - name: Display pylint summary
        run: |
          if [ -s pylint_results.json ]; then
            echo "## Pylint Issues Found" >> $GITHUB_STEP_SUMMARY
            cat pylint_results.json | jq -r '.[] | "- \(.path):\(.line): \(.message)"' >> $GITHUB_STEP_SUMMARY || cat pylint_results.json
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt 2>/dev/null || pip install pytest pytest-cov
      - run: pytest --version || echo "No tests found"
      - run: |
          if [ -f pytest.ini ] || [ -f setup.py ] || [ -f pyproject.toml ]; then
            pytest --cov=. --cov-report=xml || echo "Tests completed"
          fi
      - uses: codecov/codecov-action@v4
        if: always()

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit safety
      - run: bandit -r . -f json -o bandit_report.json || true
      - run: safety check --json --output safety_report.json || true

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install markdown-link-check
      - run: |
          find . -name "*.md" -type f ! -path "./.git/*" | head -20 | while read f; do
            echo "Checking: $f"
            markdown-link-check "$f" --config .mlc_config.json 2>/dev/null || echo "Skipped: $f"
          done
