name: Python CI

on:
  push:
    branches: [main, feat/**]
    paths: ['**.py', 'PYTHON', 'requirements.txt', 'pyproject.toml']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check . || true

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Smoke test MAPPO env
        run: |
          python3 -c "
import sys, json
sys.path.insert(0, 'engineering/DI/ML/isaac_gym')
try:
    import swarm_env
    print('swarm_env.py OK')
except Exception as e:
    print('ERROR:', e)
    sys.exit(1)
"
