name: Linear-Supabase Sync

on:
  schedule:
    - cron: '0 */4 * * *'  # Toutes les 4 heures
  workflow_dispatch:      # Permet de déclencher manuellement

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r linear_supabase/requirements.txt

      - name: Sync GitHub to Linear
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
        run: |
          cd linear_supabase
          python linear_github_sync_script.py

      - name: Send Agent Reports to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd linear_supabase
          # Exemple : Envoyer un rapport pour E3 (à adapter)
          python agent_report_to_supabase.py \
            --agent E3 \
            --actions "Automated report from GitHub Actions" \
            --blockages "None" \
            --needs "None"
