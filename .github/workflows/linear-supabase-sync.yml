name: Data Management & Sync

on:
  schedule:
    - cron: "0 */4 * * * "
  workflow_dispatch:

jobs:
  sync-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install supabase requests python-dotenv numpy
      - name: Run Monte Carlo Suite
        run: python3 -m simulation.montecarlo_pintercept
      - name: Upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            python3 simulation/supabase_upload.py
          else
            echo "SKIP: Supabase credentials not found in secrets"
          fi
