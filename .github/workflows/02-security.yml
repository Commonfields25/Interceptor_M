name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
     cron: '0 3 * * *'

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "security-extended"

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit pip-audit
      - name: Run Bandit
        run: bandit -r . -f json -o bandit_report.json || true
      - name: Run pip-audit
        run: pip-audit --format json --output pip_audit_report.json || true

  secret-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@3.18.0
        with:
          path: ./
          head: 1
