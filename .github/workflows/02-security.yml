name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
     cron: '0 3 * * *'  # Daily at 3 AM

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python,javascript"

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit safety pip-audit
      - name: Run Bandit
        run: bandit -r . -x .venv,node_modules -f screen 2>&1 | tee bandit.log || true
      - name: Run Safety
        run: safety check --stdin --json 2>/dev/null || true
      - name: Run pip-audit
        run: pip-audit --format=json --output pip-audit.json 2>/dev/null || true

  secret-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@3.18.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --audit-level=high || true
      - uses: pyupio/safety@2.5.0
        with:
          api-key: ${{ secrets.SAFETY_API_KEY }}
