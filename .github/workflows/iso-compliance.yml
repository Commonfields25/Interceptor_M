name: ISO/UAS Compliance CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  UBUNTU_RUNNER: "ubuntu-24.04"

jobs:
  iso-baseline-presence:
    name: ISO Baseline Document Present
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check engineering/ISO_UAS_BASELINE.md exists
        run: |
          [ -f "engineering/ISO_UAS_BASELINE.md" ] || (echo "ERROR: engineering/ISO_UAS_BASELINE.md not found" && false)
          echo "ISO_UAS_BASELINE.md present"

      - name: Validate ISO_UAS_BASELINE.md frontmatter
        run: |
          head -10 engineering/ISO_UAS_BASELINE.md | grep -q "ISO/UAS Baseline" || (echo "ERROR: Missing ISO/UAS Baseline header" && false)
          echo "Frontmatter validated"

  bom-baseline-presence:
    name: BOM Baseline Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate BOM exists
        run: |
          [ -f "manufacturing/BOM_consolidee.md" ] || (echo "WARNING: manufacturing/BOM_consolidee.md not found" && false)
          echo "BOM_consolidee.md present"

  engineering-docs-lint:
    name: Engineering Docs Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for key engineering docs
        run: |
          required=(
            "engineering/AVIONICS_STANDARDS.md"
            "engineering/INTEGRATED_TEST_PROTOCOL.md"
            "engineering/ISO_UAS_BASELINE.md"
            "docs/consolidated_definition.md"
          )
          all_ok=true
          for doc in "${required[@]}"; do
            if [ -f "$doc" ]; then
              echo "[OK] $doc"
            else
              echo "[MISSING] MISSING $doc"
              all_ok=false
            fi
          done
          [ "$all_ok" = true ] || (echo "ERROR: Missing required engineering docs" && false)

  secret-audit:
    name: Secret & Credential Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          grep -r "ghp_" . --exclude-dir=".github" || echo "No tokens found."
