name: Hardened Security Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit tools
        run: pip install safety pip-audit bandit

      - name: Run Safety
        run: safety check

      - name: Run pip-audit
        run: pip-audit

      - name: Run Bandit
        run: bandit -r . -x ./tests
