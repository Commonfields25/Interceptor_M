name: Hardened Security Audit

on:
  pull_request:
    branches: [main]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Set up Python
        uses: actions/setup-python@f677139bee7f93243e0b99e2f95b4e1b3c527f31
        with:
          python-version: '3.11'

      - name: Install audit tools
        run: pip install safety pip-audit bandit

      - name: Run Safety
        run: safety check || echo "Safety found issues"

      - name: Run pip-audit
        run: pip-audit || echo "pip-audit found issues"

      - name: Run Bandit
        run: bandit -r . -x ./tests || echo "Bandit found issues"
