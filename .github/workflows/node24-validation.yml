name: Node 24 Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node24-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify Node 24 is active
        run: node --version

      - name: Check npm availability
        run: npm --version

      - name: Check for package.json
        id: pkg
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: npm install + test (if package.json exists)
        if: steps.pkg.outputs.found == 'true'
        run: |
          npm ci
          npm test || npm run test || echo "No test script defined"

      - name: JS syntax scan (standalone scripts, no package.json)
        if: steps.pkg.outputs.found != 'true'
        run: |
          echo "No package.json found — skipping npm steps"
          find . -maxdepth 3 -name "*.js" -o -name "*.mjs" | head -20 || echo "No JS files found in tree"
