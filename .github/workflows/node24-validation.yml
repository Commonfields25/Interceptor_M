name: Node 24 Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node24-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Node 24 is active
        run: node --version
      - name: Check npm availability
        run: npm --version
      - name: Package.json smoke test
        if: fileExists('package.json')
        run: |
          npm ci
          npm test || npm run test || echo "No test script defined"
      - name: JS syntax scan (standalone scripts)
        if: !fileExists('package.json')
        run: |
          find . -name "*.js" -o -name "*.mjs" | head -20 || echo "No JS files found"
