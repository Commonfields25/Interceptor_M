name: Parameter Synchronization Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'PARAMETERS.json'
      - 'simulation/constants.py'

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Sync Check
        run: python3 scripts/param_sync_check.py
