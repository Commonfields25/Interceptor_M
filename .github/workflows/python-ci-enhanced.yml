name: Python CI (Unified)

on:
  push:
    branches: [main, develop, feat/**, fix/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint-and-scan:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting Tools
        run: pip install ruff bandit safety
      - name: Run Ruff
        run: ruff check .
      - name: Run Bandit (Security)
        run: bandit -r . -f text || true
      - name: Syntax-check .py files
        run: python -m py_compile $(git ls-files "*.py")

  test:
    name: Simulation & Physics Tests
    runs-on: ubuntu-latest
    needs: lint-and-scan
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Physics Smoke Tests
        run: |
          python3 -m simulation.sim_6dof
          python3 -m simulation.flight_control_poc
      - name: Run Monte Carlo Validation
        run: python3 -m simulation.montecarlo_pintercept
