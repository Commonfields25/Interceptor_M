name: IAMD Protocol Enforcer

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'

jobs:
  validate-headers:
    name: Validate IAMD Headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.md

      - name: Run IAMD Enforcer
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          python3 scripts/iamd_enforcer.py ${{ steps.changed-files.outputs.all_changed_files }}
