name: BOM-to-Parameter Sync Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'PARAMETERS.json'
      - 'manufacturing/BOM_consolidee.md'

jobs:
  check-bom-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run BOM Sync Check
        run: python3 scripts/bom_param_sync.py
