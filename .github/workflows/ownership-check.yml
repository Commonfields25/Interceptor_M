name: Modular CAD & File Ownership Check

on:
  pull_request:
    branches: [main]

jobs:
  validate-ownership:
    name: Validate File Ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46

      - name: Run Ownership Enforcer
        env:
          ACTING_AGENT_ID: ${{ github.event.pull_request.user.login }} # Or extracted from PR labels/title
        run: |
          python3 scripts/ownership_enforcer.py ${{ steps.changed-files.outputs.all_changed_files }}
