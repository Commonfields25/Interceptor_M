name: Docs Lint & Digest

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'governance/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.changed.outputs.docs }}
      count: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Find changed doc files
        id: changed
        run: |
          FILES=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" | \
            python3 -c "import sys,json; print('\n'.join([f['filename'] for f in json.load(sys.stdin) if f['filename'].endswith('.md')]))" || echo "")

          {
            echo "docs<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$FILES" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "$FILES" | wc -l)
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

  markdownlint:
    runs-on: ubuntu-latest
    needs: lint
    if: needs.lint.outputs.count != '0'
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli2 || true
      - name: Run markdownlint
        run: |
          echo "${{ needs.lint.outputs.docs }}" | while read f; do
            if [ -n "$f" ]; then
              echo "Linting: $f"
            fi
          done
        continue-on-error: true

  doc-digest:
    needs: lint
    runs-on: ubuntu-latest
    if: needs.lint.outputs.count != '0'
    steps:
      - name: Post doc digest comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const docs = `${{ needs.lint.outputs.docs }}`.trim().split('\n').filter(Boolean);
            if (docs.length === 0) return;
            const body = [
              '## 📄 Documentation Digest',
              '',
              `This PR touches **${docs.length} doc file(s)**:`,
              '',
              ...docs.map(d => `• ${d}`),
              '',
              '> ℹ️ Review the diff above instead of re-reading the full documents.',
              '_Auto-generated by Docs Lint workflow_',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
