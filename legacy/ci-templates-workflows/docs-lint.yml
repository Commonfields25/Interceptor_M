name: Docs Lint & Digest

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'governance/**'

env:
  # Opt-in Node24 (v2.328.0 default from June 16 2026)
  # Remove this or set ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=false after migration
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find changed doc files
        id: changed
        run: |
          FILES=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" | \
            python3 -c "import sys,json; print('\n'.join([f['filename'] for f in json.load(sys.stdin) if f['filename'].endswith('.md')]))" || echo "")
          echo "docs=$FILES" >> $GITHUB_OUTPUT
          echo "count=$(echo $FILES | wc -l)" >> $GITHUB_OUTPUT

  markdownlint:
    runs-on: ubuntu-latest
    needs: lint
    if: needs.lint.outputs.count != '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli2 || true
      - name: Run markdownlint
        run: |
          for f in ${{ needs.lint.outputs.docs }}; do
            echo "Linting: $f"
          done
        continue-on-error: true

  doc-digest:
    needs: lint
    runs-on: ubuntu-latest
    if: needs.lint.outputs.count != '0'
    steps:
      - name: Post doc digest comment
        uses: actions/github-script@v7
        with:
          script: |
            const docs = `${{ needs.lint.outputs.docs }}`.trim().split('\n').filter(Boolean);
            const body = [
              '## 📄 Documentation Digest',
              '',
              `This PR touches **\${docs.length} doc file(s)**:`,
              '',
              ...docs.map(d => `• \`\${d}\``),
              '',
              '> ℹ️ Review the diff above instead of re-reading the full documents.',
              '_Auto-generated by Docs Lint workflow_',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
