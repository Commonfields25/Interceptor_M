# mappo_config.yaml — MAPPO Hyperparameters for Interceptor-M Swarm RL
# Reference: SWARM-RL-PLAN.md §Training Setup
# Compatible with pymarl / oxwhirl MAPPO implementation

# ─────────────────────────────────────────────────────────────────────────────
# MAPPO Core (Multi-Agent PPO, MAPPO/MAPPO-ACKTR family)
# Paper: "Multi-Agent Actor-Critic for Mixed Cooperative-Competitive Environments" (NeurIPS 2020)
# ─────────────────────────────────────────────────────────────────────────────
algorithm:
  name: MAPPO
  mixer: qmix                 #QMIX value mixing for partially observable agents
  share_parameters: true      # shared policy/critic across agents (parameter sharing)
  use_gae: true               # Generalized Advantage Estimation
  use_rnn: true               # LSTM encoder for temporal dependencies in observation

# ─────────────────────────────────────────────────────────────────────────────
# Environment settings
# ─────────────────────────────────────────────────────────────────────────────
env:
  name: SwarmIntercept-v0
  num_envs: 4096              # parallel vectorised environments (GPU batch)
  env_args:
    max_steps: 200
    n_agents: 4               # max agents; env handles variable n

# ─────────────────────────────────────────────────────────────────────────────
# Network architecture
# ─────────────────────────────────────────────────────────────────────────────
network:
  actor:
    encoder: lstm
    hidden_size: 64           # LSTM hidden dimension
    num_layers: 1
    activation: relu
    output_activation: tanh
  critic:
    encoder: lstm
    hidden_size: 64
    num_layers: 1
    activation: relu
    mixer_hidden_dim: 64      # QMIX mixer hidden dim

# ─────────────────────────────────────────────────────────────────────────────
# Policy
# ─────────────────────────────────────────────────────────────────────────────
policy:
  gamma: 0.99                 # discount factor
  lambda: 0.95                # GAE lambda
  lr_actor: 0.0003            # actor learning rate
  lr_critic: 0.0005           # critic learning rate (often slightly higher)
  optimizer: adam
  clip_param: 0.2             # PPO clipping epsilon
  entropy_coef: 0.01          # entropy bonus coefficient (encourages exploration)
  value_loss_coef: 0.5
  max_grad_norm: 10.0         # gradient clipping
  use_max_grad_clip: true

# ─────────────────────────────────────────────────────────────────────────────
# Training loop
# ─────────────────────────────────────────────────────────────────────────────
training:
  batch_size: 4096            # steps collected before one epoch of training
  num_mini_batch: 4           # split batch into 4 mini-batches per epoch
  update_epochs: 15           # PPO epochs per data collection
  num_env_steps: 100_000_000  # total environment steps (≈100M to converge)
  episode_length: 200         # max steps per episode
  use_gae: true
  use_popart: false           # use PopArt for value normalisation (optional; disabled for simplicity)
  value_normaliser: running_mean_std  # standardise value targets

# ─────────────────────────────────────────────────────────────────────────────
# Action space specifics (continuous delta-PN)
# ─────────────────────────────────────────────────────────────────────────────
action:
  space: continuous
  output_activation: tanh     # bound outputs to [-1, 1]
  mapping:                    # MAP from normalised [-1,1] to real control commands
    delta_pitch: [-0.5, 0.5]  # rad/s
    delta_yaw:   [-0.5, 0.5]  # rad/s
    delta_thrust: [-0.1, 0.1] # thrust fraction change per step

# ─────────────────────────────────────────────────────────────────────────────
# Logging and evaluation
# ─────────────────────────────────────────────────────────────────────────────
logging:
  log_interval: 10            # log every N training epochs
  eval_interval: 50           # evaluate every N epochs (on 32 deterministic envs)
  eval_episodes: 32
  save_interval: 100          # checkpoint every N epochs
  save_dir: ./checkpoints
  tensorboard: true
  wandb: false                # set true to enable W&B logging

# ─────────────────────────────────────────────────────────────────────────────
# Hardware / performance
# ─────────────────────────────────────────────────────────────────────────────
hardware:
  num_workers: 8              # CPU workers for env simulation (Isaac Gym: 4 GPU workers)
  device: cuda
  seed: 42
  deterministic: false        # eval mode deterministic

# ─────────────────────────────────────────────────────────────────────────────
# Experiment tags
# ─────────────────────────────────────────────────────────────────────────────
tags:
  - baseline
  - mappo
  - continuous-action
  - interceptor-m