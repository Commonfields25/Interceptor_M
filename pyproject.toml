# Interceptor_M — Project Configuration
# ISO 9001 / AS9100 Compliance

[project]
name = "Interceptor_M"
version = "0.1.0"
description = "Autonomous Swarm Counter-UAS — Drone Interceptor System"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.0",
    "tinybird-sdk>=0.4.0",
    "trimesh>=4.12.2",
    "build123d>=0.11.1",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "pytest>=9.1.1",
]

[tool.vercel]
# Vercel Python runtime entrypoint (relative to project root)
# api/index.py exports an `app` ASGI application.
entrypoint = "api/index.py"

[tool.uv]
override-dependencies = [
    "urllib3>=2.0.0",
    "cryptography>=44.0.0",
    "PyJWT>=2.10.0",
    "wheel>=0.46.2",
    "python-dotenv>=1.2.0",
    "packaging>=24.0.0",
]
