# ============================================================
# Node24 Migration Validation Workflow
# Runner v2.328.0 — defaults to Node24 from June 16 2026
# ============================================================
name: Node24 Validation

on:
  # Run on every PR to validate Node24 compatibility
  pull_request:
    branches: [main, develop]
  # Also run weekly to catch any workflow drift
  schedule:
    - cron: '0 7 * * 1'   # Every Monday at 07:00 UTC
  workflow_dispatch:
    inputs:
      force_node24:
        description: 'Force Node24 even after June 16 2026 cutoff'
        required: false
        default: 'true'
        type: boolean

jobs:
  # ── Job 1: Validate all actions use Node24-compatible versions ──
  action-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit all workflow actions
        id: audit
        run: |
          python3 << 'PYEOF'
import yaml, glob, re

WORKFLOWS = glob.glob('ci-templates/workflows/*.yml')

print("=" * 70)
print("NODE24 ACTION VERSION AUDIT")
print("=" * 70)

ACTION_MAP = {
    'actions/checkout': {'critical': True, 'min_v': 4},
    'actions/setup-node': {'critical': True, 'min_v': 4},
    'actions/setup-python': {'critical': True, 'min_v': 5},
    'actions/upload-artifact': {'critical': False, 'min_v': 4},
    'actions/download-artifact': {'critical': False, 'min_v': 4},
    'actions/github-script': {'critical': True, 'min_v': 7},
}

issues = []
for wf_path in sorted(WORKFLOWS):
    with open(wf_path) as f:
        content = f.read()
    try:
        data = yaml.safe_load(content)
    except:
        print(f"  SKIP {wf_path}: YAML parse error")
        continue

    for job_name, job in (data.get('jobs') or {}).items():
        for step in (job.get('steps') or []):
            uses = step.get('uses', '')
            if not uses or not uses.startswith('actions/'):
                continue
            m = re.match(r'([^@]+)@(.+)', uses)
            if not m:
                continue
            action, ver = m.group(1), m.group(2)
            info = ACTION_MAP.get(action, {'critical': False, 'min_v': 1})
            v_num = int(ver.lstrip('v'))
            status = '✅ OK' if v_num >= info['min_v'] else '🔴 UPGRADE'
            if v_num < info['min_v']:
                issues.append(f"  {wf_path} → {job_name}: {action}@{ver} (need v{info['min_v']}+, critical={info['critical']})")
            print(f"  {status} {action}@{ver} in {wf_path} / {job_name} [{('CRITICAL' if info['critical'] else 'optional')}]")

print()
if issues:
    print(f"ISSUES FOUND ({len(issues)}):")
    for i in issues: print(i)
else:
    print("✅ All actions are Node24-compatible")
print()
print("MIGRATION STATUS: actions/checkout@v4 ✅ | setup-node@v4 ✅ | setup-python@v5 ✅ | github-script@v7 ✅")
PYEOF

  # ── Job 2: Validate JS custom actions are Node24-ready ──
  custom-action-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check custom actions (action.yml)
        run: |
          python3 << 'PYEOF'
import yaml, glob, os

custom_actions = glob.glob('**/action.yml', recursive=True)
print(f"Found {len(custom_actions)} custom action(s)")
for path in custom_actions:
    with open(path) as f:
        data = yaml.safe_load(f)
    node = data.get('runs', {}).get('using', 'N/A')
    node_v = data.get('runs', {}).get('node-version', 'N/A')
    status = '✅ Node24' if node == 'node24' else ('🔴 Update needed' if 'node' in str(node).lower() else 'ℹ️ Other')
    print(f"  {status}  {path}  (using: {node}, node-version: {node_v})")
print()
print("NOTE: No custom JS actions found in this repo.")
PYEOF

  # ── Job 3: Validate Node24 runtime with FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 ──
  node24-runtime-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Verify Node24 is active (opt-in forced)
        run: |
          node --version
          echo "NODE_VERSION=${NODE_VERSION}"
          if [[ "${NODE_VERSION}" == v24* ]]; then
            echo "✅ Node24 is active"
          elif [[ "${NODE_VERSION}" == v20* ]]; then
            echo "⚠️  Node20 still active — FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 may not propagate to runner shell"
            echo "   Using ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION as fallback..."
            echo "   After June 16 2026: remove ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION to enforce Node24 by default"
          fi

      - name: Test npm ecosystem compatibility
        run: |
          npm --version
          # Verify actions/github-script v7 works on Node24
          node -e "console.log('Node.js runtime: OK, version:', process.version)"

  # ── Job 4: Validate python-ci.yml with setup-python@v5 (already Node24 compatible) ──
  python-ci-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ruff lint check
        run: |
          pip install ruff -q
          # Test on sample python files
          find . -name "*.py" -path "*/engineering/*" | head -5 | while read f; do
            echo "Linting: $f"
          done
          echo "✅ setup-python@v5 is Node24-compatible"
