name: Weekly Metrics & Insights
on:
  schedule:
    - cron: '0 9 * * MON'   # Every Monday at 09:00 UTC
  workflow_dispatch:        # Manual trigger

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - name: Collect metrics via GitHub API
        id: metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
import subprocess, json, datetime

def gh(path):
    r = subprocess.run(['curl', '-s', '-H', f'Authorization: Bearer {open(".git/FETCH_HEAD").read().strip()[:7]}',
        f'https://api.github.com{path}'], capture_output=True, text=True)
    return json.loads(r.stdout) if r.stdout else {}

# Pull live data
issues_url = 'https://api.github.com/repos/Commonfields25/Interceptor_M/issues?state=all&per_page=100'
milestones_url = 'https://api.github.com/repos/Commonfields25/Interceptor_M/milestones'
prs_url = 'https://api.github.com/repos/Commonfields25/Interceptor_M/pulls?state=all&per_page=100'

import urllib.request
def api(url):
    req = urllib.request.Request(url, headers={'Authorization': 'Bearer ${{ secrets.GITHUB_TOKEN }}'})
    with urllib.request.urlopen(req) as r:
        return json.loads(r.read())

issues = [i for i in api(issues_url) if 'pull_request' not in i]
milestones = api(milestones_url)
prs = [p for p in api(prs_url) if p.get('merged_at') or p.get('created_at')]

now = datetime.datetime.utcnow()
report = f"""# 📊 Continuous Improvement Report
Generated: {now.strftime('%Y-%m-%d %H:%M UTC')}

## Issue Metrics

| Milestone | Open | Closed | Total | Due Date |
|-----------|-----:|-------:|------:|----------|
"""

for m in milestones:
    open_count = sum(1 for i in issues if i.get('milestone', {}).get('number') == m['number'] and i['state'] == 'open')
    closed_count = sum(1 for i in issues if i.get('milestone', {}).get('number') == m['number'] and i['state'] == 'closed')
    report += f"| {m['title']} | {open_count} | {closed_count} | {open_count+closed_count} | {m.get('due_on', 'N/A')[:10] if m.get('due_on') else 'N/A'} |
"

merged_prs = [p for p in prs if p.get('merged_at')]
avg_cycle = 0
if merged_prs:
    cycles = []
    for p in merged_prs[-10:]:
        created = datetime.datetime.strptime(p['created_at'][:10], '%Y-%m-%d')
        merged = datetime.datetime.strptime(p['merged_at'][:10], '%Y-%m-%d')
        cycles.append((merged - created).days)
    avg_cycle = sum(cycles) / len(cycles)

report += f"""
## Pull Request Metrics

| Metric | Value |
|--------|-------:|
| Total PRs merged (all time) | {len(merged_prs)} |
| Open PRs | {sum(1 for p in prs if not p.get('merged_at') and p.get('state')=='open')} |
| Avg cycle time (last 10 PRs) | {avg_cycle:.1f} days |

## Label Distribution

"""

import urllib.request
req = urllib.request.Request('https://api.github.com/repos/Commonfields25/Interceptor_M/labels?per_page=100',
    headers={'Authorization': 'Bearer ${{ secrets.GITHUB_TOKEN }}'})
with urllib.request.urlopen(req) as r:
    labels_data = json.loads(r.read())

for l in sorted(labels_data, key=lambda x: -x['count'])[:10]:
    report += f"| `{l['name']}` | {l['count']} |
"

report += """
## Red Flags Status

"""

for rf in ['red-flag:rf1', 'red-flag:rf2', 'red-flag:rf3']:
    rf_issues = [i for i in issues if any(l['name'] == rf for l in i.get('labels', []))]
    status = '✅ Resolved' if all(i['state']=='closed' for i in rf_issues) else f'🔴 {len(rf_issues)} open'
    report += f"| `{rf}` | {status} |
"

report += """
---
_Generated by GitHub Actions Weekly Metrics workflow_
"""

with open('docs/INSIGHTS_REPORT.md', 'w') as f:
    f.write(report)
print('Report written to docs/INSIGHTS_REPORT.md')
print(report)
PYEOF
      - name: Commit report
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/INSIGHTS_REPORT.md
          git diff --cached --quiet || (git commit -m "chore(metrics): update weekly insights report [skip ci]" && git push)
