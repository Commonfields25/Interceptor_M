name: Weekly Metrics & Insights

on:
  schedule:
    - cron: '0 9 * * MON'   # Every Monday at 09:00 UTC
  workflow_dispatch:        # Manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  insights:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Collect metrics via GitHub API
        id: metrics
        run: |
          python3 << 'PYEOF'
import urllib.request, json, datetime

TOKEN = "${{ secrets.GITHUB_TOKEN }}"
HEADERS = {'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/vnd.github+json'}

REPO = 'Commonfields25/Interceptor_M'

def api(url):
    req = urllib.request.Request(url, headers=HEADERS)
    with urllib.request.urlopen(req) as r:
        return json.loads(r.read())

issues = [i for i in api(f'https://api.github.com/repos/{REPO}/issues?state=all&per_page=100') if 'pull_request' not in i]
milestones = api(f'https://api.github.com/repos/{REPO}/milestones')
prs = api(f'https://api.github.com/repos/{REPO}/pulls?state=all&per_page=100')
labels_data = api(f'https://api.github.com/repos/{REPO}/labels?per_page=100')

now = datetime.datetime.utcnow()
report = f"""# 📊 Continuous Improvement Report
Generated: {now.strftime('%Y-%m-%d %H:%M UTC')}

## Issue Metrics

| Milestone | Open | Closed | Total | Due Date |
|-----------|-----:|-------:|------:|----------|
"""

for m in milestones:
    open_c = sum(1 for i in issues if i.get('milestone', {}).get('number') == m['number'] and i['state'] == 'open')
    closed_c = sum(1 for i in issues if i.get('milestone', {}).get('number') == m['number'] and i['state'] == 'closed')
    due = (m.get('due_on') or '')[:10]
    report += f"| {m['title']} | {open_c} | {closed_c} | {open_c+closed_c} | {due} |\n"

merged_prs = [p for p in prs if p.get('merged_at')]
avg_cycle = 0
if merged_prs:
    cycles = []
    for p in merged_prs[-10:]:
        created = datetime.datetime.strptime(p['created_at'][:10], '%Y-%m-%d')
        merged = datetime.datetime.strptime(p['merged_at'][:10], '%Y-%m-%d')
        cycles.append((merged - created).days)
    avg_cycle = sum(cycles) / len(cycles)

open_prs = sum(1 for p in prs if not p.get('merged_at') and p.get('state') == 'open')

report += f"""
## Pull Request Metrics

| Metric | Value |
|--------|-------:|
| Total PRs merged (all time) | {len(merged_prs)} |
| Open PRs | {open_prs} |
| Avg cycle time (last 10 PRs) | {avg_cycle:.1f} days |

## Label Distribution

| Label | Count |
|-------|------:|
"""

for l in sorted(labels_data, key=lambda x: -x['count'])[:10]:
    report += f"| `{l['name']}` | {l['count']} |\n"

report += """
## Red Flags Status

| Flag | Status |
|------|--------|
"""
for rf in ['red-flag:rf1', 'red-flag:rf2', 'red-flag:rf3']:
    rf_issues = [i for i in issues if any(lbl['name'] == rf for lbl in i.get('labels', []))]
    status = '✅ Resolved' if all(i['state'] == 'closed' for i in rf_issues) else f'🔴 {len(rf_issues)} open'
    report += f"| `{rf}` | {status} |\n"

report += """
---
_Generated by GitHub Actions Weekly Metrics workflow_
"""

with open('docs/INSIGHTS_REPORT.md', 'w') as f:
    f.write(report)
print('Report written successfully')
print(report)
PYEOF

      - name: Commit report
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/INSIGHTS_REPORT.md
          git diff --cached --quiet || (git commit -m "chore(metrics): update weekly insights report [skip ci]" && git push)
