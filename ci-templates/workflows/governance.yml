name: Governance CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  namespace-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed files
        id: files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
              "${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" | \
              python3 -c "import sys,json; print('
'.join([f['filename'] for f in json.load(sys.stdin)]))")
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
          fi
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
      - name: Run namespace isolation check
        run: |
          python3 governance/ci_checks/namespace_isolation.py \
            --json-input '[ ${{ steps.files.outputs.changed }} ]' \
            --branch-name '${{ steps.files.outputs.branch }}' \
            --verbose || true
      - name: Auto-approval KPI check
        run: |
          python3 governance/ci_checks/autoapproval_kpi_checker.py \
            --kpi-json '{"on_time_rate":95,"peer_review_rate":88,"blocker_resolution_h":18,"agent_utilization":75}'
